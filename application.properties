spring.application.name=odam

server.port=${PORT:8080}


spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.user.datasource.driver-class-name=com.mysql.jdbc.driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Lima

odam.jwt.secret=${JWT_SECRET}
odam.jwt.expiration-ms=${JWT_EXPIRATION_MS}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always